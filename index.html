<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Minimum Viable Product</title>
    </head>
    <body>
        <button id="go-to-editor">Editor</button>
        <button id="go-to-reader">Reader</button>
        <div id="editor-mode">
            <h2>Editor</h2>
            <textarea id="title-area" placeholder="Title here..." rows="1" cols="50"></textarea>
            <br>
            <textarea id="content-area" placeholder="Write here..." rows="15" cols="50"></textarea>
            <br>
            <button id="publish-button">Publish</button>
        </div>
        <div id="reader-mode" style="display: none;">
            <h2>Reader</h2>
            <menu id="title-list" style="list-style-type: none; padding: 0;"></menu>
        </div>
        <script>
            const editorMode = document.getElementById('editor-mode');
            const readerMode = document.getElementById('reader-mode');
            const editorButton = document.getElementById('go-to-editor');
            const readerButton = document.getElementById('go-to-reader');
            editorButton.addEventListener('click', () => {
                editorMode.style.display = 'block';
                readerMode.style.display = 'none';
            });
            readerButton.addEventListener('click', async () => {
                editorMode.style.display = 'none';
                readerMode.style.display = 'block';
                const titlesList = document.getElementById('title-list');
                const response = await fetch('/api/post_list');
                const posts = await response.json();
                posts.forEach(post => {
                    const li = document.createElement('li');
                    li.innerText = post.title;
                    titlesList.appendChild(li);
                });
            });

            const publishButton = document.getElementById('publish-button');
            publishButton.addEventListener('click', async () => {
                const titleArea = document.getElementById('title-area');
                const contentArea = document.getElementById('content-area');
                let postTitle = titleArea.value;
                let postContent = contentArea.value;
                const response = await fetch('/api/post_blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitle,
                        content: postContent
                    })
                });
                const result = await response.json();
                console.log(result);
                titleArea.value = '';
                contentArea.value = '';
            });
        </script>
    </body>
</html>
